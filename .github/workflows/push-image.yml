# Builds the Docker image on every push to main and pushes it to ECR, tagged with the commit
# SHA and `latest`. AWS access is through GitHub's OIDC: no AWS keys are stored in GitHub.
# Repo variables: AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY (see docs/aws-setup.md).
name: Push image

on:
  push:
    branches: [main]

permissions:
  id-token: write # lets the job ask GitHub for an OIDC token to assume the AWS role
  contents: read

concurrency:
  group: push-image
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
